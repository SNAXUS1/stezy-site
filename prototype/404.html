<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost in the static: STEZY</title>
<meta name="theme-color" content="#050509">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&text=0123456789STEZY&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center; text-align: center; overflow: hidden;
    background: radial-gradient(60vmax 60vmax at 15% 10%, rgba(47, 59, 255, 0.35), transparent 70%),
                radial-gradient(60vmax 60vmax at 90% 95%, rgba(122, 44, 255, 0.3), transparent 70%), #050509;
    color: #F2F0FF; font-family: 'Hanken Grotesk', system-ui, sans-serif;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0.16; pointer-events: none; }
  main { position: relative; padding: 24px; }
  h1 { margin: 0; font: 800 clamp(96px, 24vw, 280px)/0.9 'Unbounded', sans-serif; letter-spacing: 0.08em; margin-right: -0.08em;
       text-shadow: -0.03em 0 #3D5AFE, 0.03em 0 #FF3D9A; animation: jitter 3.2s steps(1) infinite; }
  @keyframes jitter { 0%, 90%, 100% { transform: none; } 92% { transform: translateX(-0.02em) skewX(-6deg); } 95% { transform: translateX(0.015em); } }
  p { margin: 18px auto 0; max-width: 34ch; font-size: clamp(17px, 1.6vw, 20px); line-height: 1.5; color: #A9A6C4; }
  a { display: inline-flex; margin-top: 30px; height: 50px; align-items: center; padding: 0 24px; border-radius: 999px;
      background: #ECEFFF; color: #0A0B1A; font-weight: 600; text-decoration: none; transition: transform 0.14s var(--ease-out); }
  a:active { transform: scale(0.97); }
  a:focus-visible { outline: 2px solid #F2F0FF; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { h1 { animation: none; } }
  /* Something shiny got lost in here too (the hunt on the home page) */
  @property --gem-a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  .shiny { position: fixed; left: 79%; top: 71%; z-index: 2; width: 44px; height: 44px; margin: -22px 0 0 -22px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; display: grid; place-items: center; -webkit-tap-highlight-color: transparent; }
  .shiny[hidden] { display: none; }
  .shiny::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 244, 255, .55), rgba(200, 175, 255, .2) 55%, transparent); }
  .gem { display: block; width: 16px; height: 14px; clip-path: polygon(22% 0, 78% 0, 100% 34%, 50% 100%, 0 34%);
    background: linear-gradient(118deg, rgba(255,255,255,.95) 0 13%, transparent 32%), linear-gradient(180deg, transparent 0 32%, rgba(255,255,255,.6) 33% 36%, transparent 37%),
      conic-gradient(from var(--gem-a) at 50% 42%, #FF9AD5, #FFE58A, #9AF0D2, #8FB8FF, #C59AFF, #FF9AD5);
    animation: gem-spin 3.6s linear infinite; transition: scale .22s ease, opacity .3s ease; }
  @keyframes gem-spin { to { --gem-a: 360deg; } }
  .shiny:hover .gem { scale: 1.3; }
  .shiny.got { pointer-events: none; }
  .shiny.got .gem { scale: 2.2; opacity: 0; transition: scale .45s cubic-bezier(.23, 1, .32, 1), opacity .3s ease .1s; }
  .shiny.got::before { animation: pop .55s cubic-bezier(.23, 1, .32, 1) forwards; }
  @keyframes pop { to { opacity: 0; scale: 3.4; } }
  p.found { color: #F2F0FF; }
  @media (max-width: 700px) { .shiny { left: 80%; top: 78%; } }
</style>
</head>
<body>
  <canvas id="static" aria-hidden="true"></canvas>
  <main>
    <h1>404</h1>
    <p>This page slipped into the static. It might have moved, or never existed.</p>
    <a href="/" id="home">Back to STEZY</a>
  </main>
  <button class="shiny" id="shiny" type="button" aria-label="Something shiny" hidden><i class="gem" aria-hidden="true"></i></button>
<script>
  // Coloured TV static, drawn small and scaled up, refreshed a few times a second
  const c = document.getElementById('static'), x = c.getContext('2d');
  c.width = 160; c.height = 90;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame() {
    const img = x.createImageData(c.width, c.height);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255, t = Math.random();
      img.data[i] = t < 0.33 ? v : v * 0.4; img.data[i + 1] = v * 0.45; img.data[i + 2] = t > 0.66 ? v : v * 0.8; img.data[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
  }
  frame();
  if (!reduce) setInterval(frame, 90);

  // One of the seven shiny things hides in the static. Found, it waits to be taken home (js/shiny.js lands it there).
  (() => {
    const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
    let found = [];
    try { found = JSON.parse(get('stezy-shiny') || '[]'); } catch (e) {}
    if (!Array.isArray(found) || found.includes('lost') || found.length >= 7) return;
    const b = document.getElementById('shiny');
    b.hidden = false;
    // it flickers with the static, now and then nearly gone
    if (!reduce) setInterval(() => { if (!b.classList.contains('got')) b.style.opacity = Math.random() < 0.18 ? 0.12 : (0.55 + Math.random() * 0.45).toFixed(2); }, 90);
    b.addEventListener('click', () => {
      found.push('lost');
      set('stezy-shiny', JSON.stringify(found));
      set('stezy-shiny-new', 'lost');
      b.style.opacity = 1;
      b.classList.add('got');
      try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: 'secret/shiny-lost', title: 'Shiny thing found in the static', event: true }); } catch (e) {}
      if (get('stezy-sound') !== 'off') {
        try {
          const ac = new (window.AudioContext || window.webkitAudioContext)(), out = ac.createGain();
          out.gain.value = 0.026; out.connect(ac.destination);
          [[1046.5, 0, 1.1, 0.85], [2093, 0.01, 0.5, 0.28], [1568, 0.085, 0.9, 0.45]].forEach(([f, at, dur, v]) => {
            const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + at;
            o.frequency.value = f; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            o.connect(g); g.connect(out); o.start(t0); o.stop(t0 + dur + 0.05);
          });
        } catch (e) {}
      }
      const p = document.querySelector('main p');
      p.textContent = 'You found something shiny in the static. Take it home with you.';
      p.classList.add('found');
      document.getElementById('home').textContent = 'Take it home';
      setTimeout(() => b.remove(), 700);
    });
  })();
</script>
<script data-goatcounter="https://stats.stezy.lt/count" async src="/js/count.js"></script>
</body>
</html>
