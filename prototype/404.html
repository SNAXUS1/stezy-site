<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost in the static: STEZY</title>
<meta name="theme-color" content="#050509">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&text=0123456789STEZY&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center; text-align: center; overflow: hidden;
    background: radial-gradient(60vmax 60vmax at 15% 10%, rgba(47, 59, 255, 0.35), transparent 70%),
                radial-gradient(60vmax 60vmax at 90% 95%, rgba(122, 44, 255, 0.3), transparent 70%), #050509;
    color: #F2F0FF; font-family: 'Hanken Grotesk', system-ui, sans-serif;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0.16; pointer-events: none; }
  main { position: relative; padding: 24px; }
  h1 { margin: 0; font: 800 clamp(96px, 24vw, 280px)/0.9 'Unbounded', sans-serif; letter-spacing: 0.08em; margin-right: -0.08em;
       text-shadow: -0.03em 0 #3D5AFE, 0.03em 0 #FF3D9A; animation: jitter 3.2s steps(1) infinite; }
  @keyframes jitter { 0%, 90%, 100% { transform: none; } 92% { transform: translateX(-0.02em) skewX(-6deg); } 95% { transform: translateX(0.015em); } }
  p { margin: 18px auto 0; max-width: 34ch; font-size: clamp(17px, 1.6vw, 20px); line-height: 1.5; color: #A9A6C4; }
  a { display: inline-flex; margin-top: 30px; height: 50px; align-items: center; padding: 0 24px; border-radius: 999px;
      background: #ECEFFF; color: #0A0B1A; font-weight: 600; text-decoration: none; transition: transform 0.14s var(--ease-out); }
  a:active { transform: scale(0.97); }
  a:focus-visible { outline: 2px solid #F2F0FF; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { h1 { animation: none; } }
</style>
</head>
<body>
  <canvas id="static" aria-hidden="true"></canvas>
  <main>
    <h1>404</h1>
    <p>This page slipped into the static. It might have moved, or never existed.</p>
    <a href="/">Back to STEZY</a>
  </main>
<script>
  // Coloured TV static, drawn small and scaled up, refreshed a few times a second
  const c = document.getElementById('static'), x = c.getContext('2d');
  c.width = 160; c.height = 90;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame() {
    const img = x.createImageData(c.width, c.height);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255, t = Math.random();
      img.data[i] = t < 0.33 ? v : v * 0.4; img.data[i + 1] = v * 0.45; img.data[i + 2] = t > 0.66 ? v : v * 0.8; img.data[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
  }
  frame();
  if (!reduce) setInterval(frame, 90);
</script>
</body>
</html>
