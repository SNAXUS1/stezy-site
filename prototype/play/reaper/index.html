<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>REAPER live demo · STEZY</title>
<meta name="description" content="Try REAPER, a sharper Task Manager for Windows, right in your browser with made-up data.">
<meta name="theme-color" content="#07070A">
<link rel="canonical" href="https://stezy.lt/play/reaper/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="STEZY">
<meta property="og:title" content="REAPER live demo">
<meta property="og:description" content="A sharper Task Manager for Windows. Try the interface right in your browser.">
<meta property="og:url" content="https://stezy.lt/play/reaper/">
<meta property="og:image" content="https://stezy.lt/img/share/reaper.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/img/icons/reaper.png" type="image/png">
<link rel="stylesheet" href="app.css">
<style>
  /* The website demo: no window buttons, a clear "made-up data" tag, and a way to download or go back */
  .win { display: none !important; }
  .demo-bar { display: flex; align-items: center; gap: 8px; margin-right: 12px; }
  .app { height: var(--demo-h, 100vh) !important; }
  .demo-note { position: fixed; z-index: 50; left: 50%; bottom: 14px; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 24px); padding: 10px 14px; border-radius: 12px; background: rgba(18, 18, 24, 0.94); color: #ECE7DD; font: 500 13px/1.4 system-ui, sans-serif; box-shadow: 0 10px 30px -10px #000, inset 0 0 0 1px rgba(236, 231, 221, 0.15); }
  .demo-note[hidden] { display: none; }
  .demo-tag { padding: 5px 10px; border-radius: 999px; font: 600 10px/1 system-ui, sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: #ECE7DD; box-shadow: inset 0 0 0 1px rgba(236, 231, 221, 0.25); white-space: nowrap; }
  .demo-bar a { display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 999px; font: 600 12.5px/1 system-ui, sans-serif; text-decoration: none; white-space: nowrap; }
  .demo-back { color: #ECE7DD; box-shadow: inset 0 0 0 1px rgba(236, 231, 221, 0.22); }
  .demo-back:hover { background: rgba(236, 231, 221, 0.08); }
  .demo-dl { color: #0A0A0D; background: #ECE7DD; }
  .demo-dl:hover { background: #fff; }
</style>
</head>
<body>
<div class="app" id="app">

  <header class="top">
    <div class="brand" aria-label="REAPER">
      <svg class="crescent" viewBox="0 0 132 44" aria-hidden="true">
        <defs>
          <linearGradient id="blade" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#ECE7DD" stop-opacity="0"/>
            <stop offset=".35" stop-color="#ECE7DD" stop-opacity=".55"/>
            <stop offset=".78" stop-color="#F4F1EA" stop-opacity="1"/>
            <stop offset="1" stop-color="#C9D8F0" stop-opacity=".9"/>
          </linearGradient>
          <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#8FB3E8" stop-opacity="0"/>
            <stop offset=".6" stop-color="#8FB3E8" stop-opacity=".55"/>
            <stop offset="1" stop-color="#8FB3E8" stop-opacity=".9"/>
          </linearGradient>
        </defs>
        <path class="crescent-glow" d="M4 41 C 18 18, 52 4, 92 3.2 C 108 2.9, 121 4.6, 129 8.4 C 116 6.4, 104 6.2, 92 6.9 C 56 9, 24 22, 4 41 Z"/>
        <path d="M4 41 C 18 18, 52 4, 92 3.2 C 108 2.9, 121 4.6, 129 8.4 C 116 6.4, 104 6.2, 92 6.9 C 56 9, 24 22, 4 41 Z" fill="url(#blade)"/>
        <path d="M30 22.5 C 50 10.5, 72 4.6, 92 3.2 C 108 2.9, 121 4.6, 129 8.4" fill="none" stroke="url(#rim)" stroke-width=".6"/>
      </svg>
      <span class="wordmark">REAPER</span>
    </div>

    <button class="status" id="status" data-tone="calm" type="button">
      <span class="status-dot"></span>
      <span class="status-text" id="status-text">Reading your system…</span>
    </button>

    <div class="top-right">
      <label class="search" id="search-wrap">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.75"/><path d="M10.6 10.6 14 14"/></svg>
        <input id="search" type="text" placeholder="Find an app or window…" spellcheck="false" autocomplete="off">
        <kbd id="search-kbd">Ctrl F</kbd>
        <button class="search-clear" id="search-clear" type="button" tabindex="-1" aria-label="Clear search">
          <svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
        </button>
      </label>
      <button class="icon-btn" id="btn-admin" type="button" data-tip="Restart as administrator to manage every process" hidden>
        <svg viewBox="0 0 20 20"><path d="M10 2.6 4 5v4.6c0 3.7 2.5 6.6 6 7.8 3.5-1.2 6-4.1 6-7.8V5l-6-2.4Z"/><path d="M10 7v3.6M10 12.9v.1"/></svg>
      </button>
      <button class="icon-btn" id="btn-overlay" type="button" data-tip="Game overlay · Ctrl+Alt+F">
        <svg viewBox="0 0 20 20"><path d="M3.2 14.2a7 7 0 1 1 13.6 0"/><path d="M10 13.2 13.2 8"/><circle cx="10" cy="13.4" r="1.1"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" type="button" data-tip="Settings">
        <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.1M10 15.4v2.1M17.5 10h-2.1M4.6 10H2.5M15.3 4.7l-1.5 1.5M6.2 13.8l-1.5 1.5M15.3 15.3l-1.5-1.5M6.2 6.2 4.7 4.7"/></svg>
      </button>
      <div class="demo-bar">
        <span class="demo-tag" title="Nothing here comes from your PC">Live demo · made-up data</span>
        <a class="demo-back" href="/#reaper">stezy.lt</a>
        <a class="demo-dl" href="https://github.com/SNAXUS1/stezy-site/releases/download/reaper-v1.0.0/REAPER-1.0.0.zip">Download</a>
      </div>
      <div class="win">
        <button type="button" data-win="min" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6.5h8"/></svg></button>
        <button type="button" data-win="max" aria-label="Maximize"><svg class="i-max" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.4"/></svg><svg class="i-restore" viewBox="0 0 12 12"><rect x="2" y="3.6" width="6.4" height="6.4" rx="1.2"/><path d="M4 2h4.6A1.4 1.4 0 0 1 10 3.4V8"/></svg></button>
        <button type="button" data-win="close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
      </div>
    </div>
  </header>

  <section class="telemetry" id="telemetry">
    <div class="meter" data-m="cpu">
      <div class="meter-head"><span class="meter-label">Processor</span><span class="meter-value"><b>0</b><i>%</i></span></div>
      <canvas class="spark"></canvas>
      <div class="meter-sub">&nbsp;</div>
    </div>
    <div class="meter" data-m="gpu">
      <div class="meter-head"><span class="meter-label">Graphics</span><span class="meter-value"><b>0</b><i>%</i></span></div>
      <canvas class="spark"></canvas>
      <div class="meter-sub">&nbsp;</div>
    </div>
    <div class="meter" data-m="mem">
      <div class="meter-head"><span class="meter-label">Memory</span><span class="meter-value"><b>0</b><i>%</i></span></div>
      <canvas class="spark"></canvas>
      <div class="meter-sub">&nbsp;</div>
    </div>
    <div class="meter" data-m="disk">
      <div class="meter-head"><span class="meter-label">Disk</span><span class="meter-value"><b>0</b><i>%</i></span></div>
      <canvas class="spark"></canvas>
      <div class="meter-sub">&nbsp;</div>
    </div>
  </section>

  <main class="body">
    <section class="list-pane">
      <div class="list" id="list" tabindex="0">
        <div class="list-head" id="list-head">
          <button class="col col-name" data-sort="n" type="button"><span>Name</span><em id="count-procs"></em><svg class="sort-ind" viewBox="0 0 10 10"><path d="M2.5 4 5 6.5 7.5 4"/></svg></button>
          <button class="col col-num" data-sort="c" type="button"><span>CPU</span><em id="tot-c"></em><svg class="sort-ind" viewBox="0 0 10 10"><path d="M2.5 4 5 6.5 7.5 4"/></svg></button>
          <button class="col col-num" data-sort="g" type="button"><span>GPU</span><em id="tot-g"></em><svg class="sort-ind" viewBox="0 0 10 10"><path d="M2.5 4 5 6.5 7.5 4"/></svg></button>
          <button class="col col-num" data-sort="m" type="button"><span>Memory</span><em id="tot-m"></em><svg class="sort-ind" viewBox="0 0 10 10"><path d="M2.5 4 5 6.5 7.5 4"/></svg></button>
          <button class="col col-num" data-sort="d" type="button" data-tip="Everything a process reads and writes: files, pipes and devices"><span>I/O</span><em id="tot-d"></em><svg class="sort-ind" viewBox="0 0 10 10"><path d="M2.5 4 5 6.5 7.5 4"/></svg></button>
        </div>
        <div class="rows" id="rows"></div>
        <div class="empty" id="empty" hidden></div>
      </div>
    </section>

    <aside class="detail" id="detail">
      <div class="detail-scroll" id="detail-scroll"></div>
      <div class="detail-actions" id="detail-actions"></div>
    </aside>
  </main>

  <footer class="recorder" id="recorder">
    <div class="rec-label">
      <span class="rec-title"><i class="rec-led"></i>Flight recorder</span>
      <span class="rec-range" id="rec-range">Last 30 min</span>
    </div>
    <div class="rec-track" id="rec-track">
      <canvas id="rec-canvas"></canvas>
      <div class="rec-markers" id="rec-markers"></div>
      <div class="rec-cursor" id="rec-cursor" hidden><span></span></div>
    </div>
    <button class="ghost small" id="rec-all" type="button">All events</button>
  </footer>
</div>

<div class="grain" aria-hidden="true"></div>
<div class="layer" id="layer"></div>
<div class="toasts" id="toasts"></div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
  // REAPER's own icon for the demo row, and a smaller screen just shows the whole window scaled down
  window.REAPER_DEMO_ICONS = { reaper: '/img/icons/reaper.png' };
  (function fit() {
    const w = 1180;
    const apply = () => {
      const z = innerWidth < w ? innerWidth / w : 1;
      document.getElementById('app').style.zoom = z < 1 ? String(z) : '';
      document.documentElement.style.setProperty('--demo-h', innerHeight / z + 'px');
    };
    apply();
    addEventListener('resize', apply);
    // On a phone everything is shrunk to fit, so say so once
    if (innerWidth < 700) {
      const n = document.createElement('div');
      n.className = 'demo-note';
      n.textContent = 'REAPER is a Windows app. On a phone this demo is shrunk to fit: turn it sideways or open it on a computer.';
      n.addEventListener('click', () => { n.hidden = true; });
      document.body.appendChild(n);
    }
  })();
</script>
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
