<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Beltline: a Satisfactory factory planner. Tell it what you have unlocked and what you mine, get machine counts, clock speeds and a map of every splitter and merger.">
<meta property="og:title" content="Beltline - Satisfactory planner">
<meta property="og:description" content="Machine counts, clock speeds and a map of every splitter and merger, from what you have.">
<meta name="theme-color" content="#17191c">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<title>Beltline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: setup rail on the left, the factory map is the main stage. Graphite greys, a live grid behind everything; amber = belts, blue = pipes. */
:root {
  color-scheme: dark;
  --bg: #17191c;
  --panel: #1e2125;
  --panel-2: #24282d;
  --panel-3: #2c3036;
  --line: #31353b;
  --line-2: #40454c;
  --fg: #eceef1;
  --muted: #a3a9b0;
  --faint: #6e747b;
  --ink: #15171a;
  --belt: #f0a447;
  --belt-soft: rgba(240, 164, 71, 0.14);
  --fluid: #5cb5e8;
  --fluid-soft: rgba(92, 181, 232, 0.14);
  --merge: #5fd0b8;
  --good: #6fcf97;
  --good-soft: rgba(111, 207, 151, 0.12);
  --warn: #f2c94c;
  --warn-soft: rgba(242, 201, 76, 0.12);
  --bad: #ef6f5e;
  --bad-soft: rgba(239, 111, 94, 0.13);
  --display: "Space Grotesk", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--fg); font: 14px/1.5 var(--body); min-height: 100vh; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.grid-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size: 40px 40px, 40px 40px, 200px 200px, 200px 200px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 40%, transparent 100%); mask-image: radial-gradient(ellipse at 50% 30%, #000 40%, transparent 100%); }
::selection { background: var(--fg); color: var(--ink); }
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--faint); }
::-webkit-scrollbar-corner { background: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.wrap { position: relative; z-index: 1; max-width: 2400px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 38px; height: 38px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line-2); display: grid; place-items: center; }
.logo svg { width: 22px; height: 22px; }
.brand-t { display: flex; flex-direction: column; line-height: 1; }
.brand-t small { font: 600 10px var(--mono); letter-spacing: .34em; color: var(--faint); margin-bottom: 5px; }
.brand-t b { font: 700 26px var(--display); letter-spacing: .02em; }
.brand-t b span { color: var(--muted); font-weight: 500; font-size: 15px; letter-spacing: .04em; margin-left: 8px; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 7px; font: 12px var(--mono); color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 30px; padding: 5px 11px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }

.tabs { display: none; gap: 6px; margin-bottom: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); padding-block: 8px; }
.tabs button { flex: 1; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 9px; font: 600 14px var(--display); color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--ink); border-color: var(--fg); }

.layout { display: grid; grid-template-columns: minmax(320px, 360px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (min-width: 1700px) { .wrap { padding-left: 28px; padding-right: 28px; } .layout { grid-template-columns: 400px minmax(0, 1fr); gap: 22px; } }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

/* cards */
.card { background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: 14px; padding: 15px; display: flex; flex-direction: column; gap: 13px; min-width: 0; backdrop-filter: blur(6px); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-h h2 { margin: 0; font: 600 15px/1.2 var(--display); letter-spacing: .02em; display: flex; align-items: center; gap: 9px; }
.num-badge { width: 22px; height: 22px; border-radius: 7px; background: var(--panel-3); color: var(--muted); display: grid; place-items: center; font: 600 11px var(--mono); }
.label { font: 600 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.field { display: flex; flex-direction: column; gap: 7px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tiny { font-size: 12px; color: var(--faint); line-height: 1.45; }

.seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; max-width: 100%; }
.seg button { border: 0; background: transparent; border-radius: 6px; padding: 6px 9px; font: 600 12.5px/1.1 var(--display); color: var(--muted); min-width: 28px; transition: background .15s, color .15s; white-space: nowrap; }
.seg button:hover { color: var(--fg); background: var(--panel-3); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--ink); }
.seg.full { display: flex; }
.seg.full button { flex: 1; }
.seg.mono button { font-family: var(--mono); font-size: 12.5px; padding-inline: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 9px; padding: 8px 12px; font: 600 13px/1 var(--display); transition: border-color .15s, background .15s; white-space: nowrap; }
.btn:hover { border-color: var(--muted); background: var(--panel-3); }
.btn.light { background: var(--fg); color: var(--ink); border-color: var(--fg); }
.btn.ghost { background: transparent; border-style: dashed; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); }
.btn.sm { padding: 6px 9px; font-size: 12px; }
.btn svg { width: 14px; height: 14px; }
.icon-btn { border: 0; background: transparent; color: var(--faint); padding: 6px; border-radius: 7px; display: inline-flex; }
.icon-btn:hover { color: var(--fg); background: var(--panel-3); }
.icon-btn.del:hover { color: var(--bad); background: var(--bad-soft); }
.icon-btn svg { width: 15px; height: 15px; }
.count-pill { font: 600 11px var(--mono); background: var(--panel-3); border-radius: 20px; padding: 2px 7px; color: var(--muted); }

.rows { display: flex; flex-direction: column; gap: 8px; }
.rowbox { border: 1px solid var(--line); background: var(--panel-2); border-radius: 11px; padding: 9px; display: flex; flex-direction: column; gap: 8px; }
.rowline { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
.picker-btn { flex: 1 1 150px; min-width: 0; height: 34px; align-self: center; display: flex; align-items: center; gap: 8px; text-align: left; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 9px; font-weight: 600; font-size: 13.5px; }
.picker-btn:hover { border-color: var(--muted); }
.picker-btn .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker-btn .chev { color: var(--faint); width: 14px; height: 14px; flex: none; }
.picker-btn.is-empty .nm { color: var(--faint); font-weight: 500; }
.chip { width: 9px; height: 9px; border-radius: 3px; background: var(--belt); flex: none; display: inline-block; }
.chip.fluid { background: var(--fluid); border-radius: 50%; }
.chip.raw { background: var(--muted); }
.chip.power { background: #f2d85a; border-radius: 2px; transform: rotate(45deg) scale(.8); }
.pw-tag { color: #f2d85a; }
.num { display: inline-flex; align-items: center; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.num:focus-within { border-color: var(--muted); }
.num input { width: 64px; border: 0; background: transparent; padding: 6px 7px; font-family: var(--mono); font-size: 13.5px; text-align: right; outline: none; -moz-appearance: textfield; appearance: textfield; }
.num input::-webkit-outer-spin-button, .num input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.num .u { padding: 0 8px 0 2px; color: var(--faint); font: 11.5px var(--mono); }
.eq { font: 12.5px var(--mono); color: var(--muted); }
.eq b { color: var(--fg); font-weight: 600; }
.mini-seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; gap: 2px; }
.mini-seg button { border: 0; background: transparent; padding: 4px 8px; border-radius: 6px; font: 600 11.5px var(--display); color: var(--muted); }
.mini-seg button[aria-pressed="true"] { background: var(--panel-3); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line-2); }
.warn-t { font-size: 12px; color: var(--warn); }

.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13.5px; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle .box { width: 32px; height: 18px; border-radius: 18px; background: var(--panel-3); border: 1px solid var(--line-2); position: relative; flex: none; transition: background .15s; }
.toggle .box::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--faint); transition: transform .18s ease, background .18s; }
.toggle input:checked + .box { background: var(--fg); border-color: var(--fg); }
.toggle input:checked + .box::after { transform: translateX(14px); background: var(--ink); }
.toggle input:focus-visible + .box { outline: 2px solid var(--fg); outline-offset: 2px; }

.share { display: flex; align-items: center; gap: 8px; flex: 1 1 180px; min-width: 0; }
.share input[type="range"] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 70px; height: 22px; background: transparent; }
.share input[type="range"]::-webkit-slider-runnable-track { height: 5px; border-radius: 5px; background: linear-gradient(90deg, var(--fg) var(--p, 50%), var(--panel-3) var(--p, 50%)); }
.share input[type="range"]::-moz-range-track { height: 5px; border-radius: 5px; background: var(--panel-3); }
.share input[type="range"]::-moz-range-progress { height: 5px; border-radius: 5px; background: var(--fg); }
.share input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 17px; height: 17px; border-radius: 50%; background: var(--fg); border: 3px solid var(--panel-2); margin-top: -6px; box-shadow: 0 0 0 1px var(--line-2); }
.share input[type="range"]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--fg); border: 3px solid var(--panel-2); }
.share .lab { font-size: 11.5px; color: var(--faint); }
.share-out { font: 600 12.5px var(--mono); color: var(--belt); white-space: nowrap; margin-left: auto; }

/* factory switcher */
.fac-btn { display: inline-flex; align-items: center; gap: 9px; margin-left: 8px; border: 1px solid var(--line-2); background: var(--panel); border-radius: 10px; padding: 7px 10px 7px 12px; font: 600 14px var(--display); max-width: 260px; }
.fac-btn:hover { border-color: var(--muted); }
.fac-btn .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fac-btn .chev { width: 14px; height: 14px; color: var(--faint); flex: none; }
.fac-btn .k { font: 600 10px var(--mono); letter-spacing: .12em; color: var(--faint); text-transform: uppercase; }
.fac-pop { padding: 10px; gap: 8px; }
.fac-pop .searchbox input { font-weight: 600; }
.fac-list { display: flex; flex-direction: column; gap: 2px; max-height: 260px; overflow-y: auto; }
.fac-item { display: flex; align-items: center; gap: 9px; border: 0; background: transparent; text-align: left; padding: 8px 9px; border-radius: 8px; font-size: 13.5px; width: 100%; }
.fac-item:hover { background: var(--panel-3); }
.fac-item .d { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); flex: none; }
.fac-item.on .d { background: var(--fg); }
.fac-item.on { font-weight: 600; }
.fac-acts { display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 9px; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn.danger.armed { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }

/* popover */
.pop { position: fixed; z-index: 60; width: min(340px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.55); display: flex; flex-direction: column; overflow: hidden; }
.pop-search { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.pop-search svg { width: 15px; height: 15px; color: var(--faint); flex: none; }
.pop-search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 15px; }
.pop-list { max-height: 320px; overflow-y: auto; padding: 6px; }
.pop-group { font: 600 10px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--faint); padding: 8px 8px 4px; }
.pop-item { width: 100%; display: flex; align-items: center; gap: 9px; border: 0; background: transparent; text-align: left; padding: 7px 8px; border-radius: 7px; font-size: 13.5px; }
.pop-item:hover, .pop-item.hl { background: var(--panel-3); }
.pop-item .lk { margin-left: auto; font: 11px var(--mono); color: var(--faint); white-space: nowrap; }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(8,9,11,.6); z-index: 50; display: flex; justify-content: flex-end; }
.sheet { width: min(540px, 100%); height: 100%; background: var(--panel); border-left: 1px solid var(--line-2); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); animation: slide .22s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-h { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.sheet-h .t { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet-h h3 { margin: 0; font: 700 19px var(--display); }
.sheet-body { overflow-y: auto; padding: 8px 12px 24px; flex: 1; }
.sheet-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.pz-tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.pz-tbl td { padding: 7px 8px; border-bottom: 1px dashed var(--line); }
.pz-tbl td.r { text-align: right; font-family: var(--mono); color: var(--muted); white-space: nowrap; }
.pz-tbl tr.off td { opacity: .45; }
.pz-tbl .why { font-size: 11.5px; color: var(--warn); }
.pz-ms { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 4px 12px; }
.pz-ms button { border: 1px solid var(--line-2); background: var(--panel-2); color: var(--muted); border-radius: 30px; padding: 5px 11px; font: 600 12px var(--display); }
.pz-ms button[aria-pressed="true"] { background: var(--fg); color: var(--ink); border-color: var(--fg); }
.pz-ctl { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
/* live outputs bar */
#outbar:empty { display: none; }
.outbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.outbar > .label { flex-basis: 100%; }
.ob-row { display: flex; align-items: center; gap: 9px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; flex: 1 1 330px; min-width: 0; }
.ob-nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.ob-row .share { flex: 1 1 90px; }
.ob-row .share-out { margin-left: auto; }
.searchbox { display: flex; align-items: center; gap: 8px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 9px; padding: 8px 10px; }
.searchbox svg { width: 15px; height: 15px; color: var(--faint); }
.searchbox input { flex: 1; border: 0; background: transparent; outline: none; min-width: 0; }
.alt-item { display: flex; gap: 11px; align-items: flex-start; padding: 9px 8px; border-radius: 9px; cursor: pointer; }
.alt-item:hover { background: var(--panel-2); }
.alt-item input { position: absolute; opacity: 0; pointer-events: none; }
.cb { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line-2); flex: none; margin-top: 2px; display: grid; place-items: center; }
.alt-item input:checked + .cb { background: var(--fg); border-color: var(--fg); }
.alt-item input:checked + .cb::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(-45deg) translate(1px, -1px); }
.alt-item input:focus-visible + .cb { outline: 2px solid var(--fg); outline-offset: 2px; }
.alt-name { font-weight: 600; }
.alt-rec { font: 11.5px/1.5 var(--mono); color: var(--muted); }
.alt-rec .m { color: var(--fg); }
.group-h { font: 600 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--faint); padding: 14px 8px 4px; }

/* plan */
.banner { border-radius: 12px; padding: 11px 14px; font-size: 13.5px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.banner.info { background: var(--panel-2); border: 1px solid var(--line-2); }
.banner.bad { background: var(--bad-soft); border: 1px solid rgba(239,111,94,.35); }
.banner.warn { background: var(--warn-soft); border: 1px solid rgba(242,201,76,.32); }
.banner b { color: var(--fg); }
.summary { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(4, minmax(0, 1fr)); gap: 10px; }
.sum-main { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }
.sum-main .outs { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.sum-main .o { font: 600 20px/1.2 var(--display); white-space: nowrap; }
.sum-main .o small { font: 500 12px var(--mono); color: var(--muted); margin-left: 4px; }
.stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; min-width: 0; }
.stat .v { font: 600 22px/1.15 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .v small { font-size: 11.5px; color: var(--muted); font-weight: 400; }
.usage { display: flex; flex-wrap: wrap; gap: 8px; }
.use { flex: 1 1 210px; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; display: flex; flex-direction: column; gap: 6px; }
.use-top { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.use-top .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.use-top .q { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
.use-top .q b { color: var(--fg); }
.bar { height: 4px; background: var(--panel-3); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--belt); border-radius: 4px; }
.bar i.fluid { background: var(--fluid); }
.bar i.over { background: var(--bad); }
.use .note { font-size: 11.5px; color: var(--muted); }

.map-card { padding: 0; overflow: hidden; gap: 0; }
.map-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 11px 13px; border-bottom: 1px solid var(--line); }
.map-bar .grow { flex: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; vertical-align: -2px; margin-right: 5px; }
.lg-s { width: 12px; height: 12px; border: 1.6px solid var(--belt); border-radius: 3px; }

.map-scroll { overflow: auto; max-height: 76vh; min-height: 260px; background:
  radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 1.4px) 0 0 / 20px 20px, var(--bg); cursor: grab; }

/* svg */

.dg .tw { fill: var(--warn); font-size: 12px; font-weight: 600; }
.dg .ln { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.dg .ln-s { stroke: var(--belt); }

.dg .sp { fill: var(--panel); stroke: var(--belt); stroke-width: 1.6; }

.dg .ah-s { fill: var(--belt); }
.dg .ah-f { fill: var(--fluid); }
.dg .node rect.box { stroke-width: 1.3; transition: stroke .15s, fill .15s; }
.dg .n-sup rect.box { fill: var(--panel); stroke: var(--line-2); }
.dg .n-step rect.box { fill: var(--panel-2); stroke: var(--line-2); }
.dg .n-out rect.box { fill: var(--panel); stroke: var(--good); }
.dg .n-left rect.box { fill: var(--panel); stroke: var(--warn); stroke-dasharray: 4 3; }
.dg .mod rect.box { fill: var(--panel); stroke: var(--line-2); }

.dg .node:hover rect.box { stroke: var(--muted); }

.dg .accent-bar { fill: var(--belt); }
.dg .accent-bar.f { fill: var(--fluid); }
.dg .port-s { fill: var(--belt); }
.dg .port-f { fill: var(--fluid); }

.dg .badge rect { fill: var(--panel-3); }

.dg .ubar { fill: var(--panel-3); }

.dg .rail-gap { stroke: var(--bg) !important; marker-end: none; }
.dg .mod .rail-gap { stroke: var(--panel) !important; }
.dg .stage-bg { fill: rgba(255,255,255,.018); stroke: rgba(255,255,255,.06); stroke-dasharray: 3 5; }

.dg .mach.amp { stroke: #c4a6ff; }
.dg .badge.amp rect { fill: rgba(196,166,255,.16); }
.dg .badge.amp text { fill: #c4a6ff; }
.dg .lbl-bg { stroke-opacity: .55; }
.dg .lbl .w { fill: var(--warn); font-weight: 600; }
.tag.amp { color: #c4a6ff; background: rgba(196,166,255,.14); }
.stat.over { border-color: rgba(239,111,94,.5); }
.legend .it { display: inline-flex; align-items: center; gap: 5px; }
.legend .it i { width: 14px; height: 4px; border-radius: 2px; margin: 0; }
.blist tr.stage-h td { padding: 14px 10px 6px; border-top: 0; font: 600 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
.link-tag { font-size: 12px; color: var(--muted); background: var(--panel); border: 1px dashed var(--line-2); border-radius: 7px; padding: 5px 8px; }
#busy { display: none; }

.hist { display: inline-flex; gap: 2px; }

.tick { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line-2); background: transparent; display: grid; place-items: center; padding: 0; }

.toast { position: fixed; z-index: 70; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--ink); font-weight: 600; font-size: 13.5px; padding: 10px 16px; border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.4); animation: pop .2s ease-out; transition: opacity .35s; max-width: calc(100vw - 32px); }

.upd { position: fixed; z-index: 71; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; align-items: center; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px 10px 16px; font-size: 13.5px; box-shadow: 0 12px 30px rgba(0,0,0,.45); animation: pop .2s ease-out; max-width: calc(100vw - 32px); }

/* zoomable map */
.vp { position: relative; height: 72vh; min-height: 340px; overflow: hidden; touch-action: none; cursor: grab;
  background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 1.4px) 0 0 / 20px 20px, var(--bg); }

/* step-by-step guide */

  background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 1.4px) 0 0 / 20px 20px, var(--bg); }

.gsteps { margin: 0; padding-left: 24px; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; color: var(--muted); line-height: 1.55; }

.btn:disabled { opacity: .4; cursor: default; }

/* build list */

.list2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 4px 18px; font-size: 13px; margin-top: 12px; }

/* inspector */
.insp { position: fixed; z-index: 30; top: 16px; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px; width: 380px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.5); display: flex; flex-direction: column; overflow: hidden; animation: pop .18s ease-out; }

.suggest { border: 1px dashed var(--line-2); border-radius: 10px; padding: 9px 10px; display: flex; flex-direction: column; gap: 7px; margin: 2px 0 4px; }

.pw-auto { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; font: 600 13px var(--body); color: var(--fg); }

  /* ---------------- account sync (when opened on claude.ai) ---------------- */

  /* ---------------- what you have ---------------- */
  var PURITY = { impure: 0.5, normal: 1, pure: 2 };
  function nodeKind(item) {

    if (item === 'LiquidOil') return 'oil';
    if (item === 'NitrogenGas') return 'well';
    var it = D.items[item]; return it && it.raw ? 'miner' : null;
  }
  function linkRate(h) {

  }

  /* ---------------- engine ---------------- */

      limitToHave: state.limitToHave, goal: state.goal, split: state.noClock ? (state.balance === 'balanced' ? 'even' : 'fill') : state.split, easyCounts: state.easyCounts, balance: state.balance === 'balanced' ? 'balanced' : 'manifold',

  var worker = null, reqId = 0, busyTimer = null;

  // what the plan still needs from "You have"
  function planNeeds() {

      var list = t.getAttribute('data-list'), row = +t.getAttribute('data-row'), f = t.getAttribute('data-f');
      state[list][row][f] = t.value === '' ? '' : +t.value;
      document.querySelectorAll('input[data-list="' + list + '"][data-row="' + row + '"][data-f="' + f + '"]').forEach(function (x) {
        if (x === t) return; x.value = t.value; if (x.type === 'range') x.style.setProperty('--p', ((+t.value - 1) / 9 * 100) + '%');
      });
      if (t.type === 'range') t.style.setProperty('--p', ((+t.value - 1) / 9 * 100) + '%');
      var out = document.querySelector('[data-out="' + list + '-' + row + '"]');
      if (out) out.textContent = fmt(rowRate(state[list][row]));
      changed(false);
    }
  });
  document.addEventListener('change', function (e) { var t = e.target; if (t.matches('input[data-opt]')) { state[t.getAttribute('data-opt')] = t.checked; changed(true); } });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && selected && !document.querySelector('.scrim')) select(null);
    var typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
    if (!typing && (e.ctrlKey || e.metaKey) && !e.altKey) {
      var k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { undo(); e.preventDefault(); }
      else if (k === 'y' || (k === 'z' && e.shiftKey)) { redo(); e.preventDefault(); }
    }
  });
  window.addEventListener('resize', function () { closePop(); if (!vpUser) refit(); });
  var BELTLINE_BUILD = '20261124204048';
  function checkForUpdate() {
    if (!/^\d+$/.test(BELTLINE_BUILD) || !/^https?:$/.test(location.protocol) || document.querySelector('.upd')) return;
    fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
      var m = t.match(/BELTLINE_BUILD = '(\d+)'/);
      if (!m || m[1] === BELTLINE_BUILD || +m[1] < +BELTLINE_BUILD || document.querySelector('.upd')) return;
      var el = document.createElement('div'); el.className = 'upd'; el.setAttribute('role', 'status');
      el.innerHTML = '<span><b>A newer Beltline is out.</b> Your plans are kept.</span><button class="btn sm light" type="button">Reload</button>';
      el.querySelector('button').addEventListener('click', function () { saveLocal(); location.reload(); });
      document.body.appendChild(el);
    }).catch(function () {});
  }
  setTimeout(checkForUpdate, 4000);
  setInterval(checkForUpdate, 10 * 60 * 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkForUpdate(); });
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); }, 400); }, 4200);
  }
  function applyPane() {
    document.querySelectorAll('[data-pane]').forEach(function (p) { if (p.getAttribute('data-pane') === pane) p.removeAttribute('hidden-pane'); else p.setAttribute('hidden-pane', ''); });
    document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-v') === pane)); });
    if (pane === 'plan' && !vpUser) refit();
  }

  /* ---------------- moving grid lines ---------------- */
  (function () {
    var c = document.getElementById('bg'), ctx = c.getContext('2d'), W = 0, H = 0, dpr = 1, pulses = [], last = 0, GRID = 40;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function resize() { dpr = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight; c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
    function spawn(initial) {
      var hor = Math.random() < 0.6, ext = hor ? W : H, span = hor ? H : W;
      return { hor: hor, at: Math.floor(Math.random() * (span / GRID)) * GRID + 0.5, pos: initial ? Math.random() * ext : -60, len: 50 + Math.random() * 140,
        speed: 22 + Math.random() * 60, a: 0.07 + Math.random() * 0.12, warm: Math.random() < 0.22 };
    }
    function frame(t) {
      var dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
      ctx.clearRect(0, 0, W, H);
      pulses.forEach(function (p, i) {
        p.pos += p.speed * dt;
        var ext = p.hor ? W : H;
        if (p.pos - p.len > ext) { pulses[i] = spawn(false); return; }
        var x0 = p.hor ? p.pos - p.len : p.at, y0 = p.hor ? p.at : p.pos - p.len, x1 = p.hor ? p.pos : p.at, y1 = p.hor ? p.at : p.pos;
        var g = ctx.createLinearGradient(x0, y0, x1, y1), col = p.warm ? '240,164,71' : '236,238,241';
        g.addColorStop(0, 'rgba(' + col + ',0)'); g.addColorStop(1, 'rgba(' + col + ',' + p.a + ')');
        ctx.strokeStyle = g; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
        ctx.fillStyle = 'rgba(' + col + ',' + (p.a * 1.6) + ')'; ctx.beginPath(); ctx.arc(x1, y1, 1.4, 0, Math.PI * 2); ctx.fill();
      });
      if (!document.hidden) requestAnimationFrame(frame); else setTimeout(function () { requestAnimationFrame(frame); }, 500);
    }
    resize(); window.addEventListener('resize', resize);
    if (reduce) return;
    for (var i = 0; i < 16; i++) pulses.push(spawn(true));
    requestAnimationFrame(frame);
  })();

  /* ---------------- boot ---------------- */
  var dataP = window.PLANNER_DATA ? Promise.resolve(window.PLANNER_DATA) : fetch('data.json').then(function (r) { if (!r.ok) throw new Error('data.json ' + r.status); return r.json(); });
  dataP.then(function (data) {
    D = E.init(data);
    startWorker(data);
    state = normalize(loadLocal());
    committed = histSnap();
    document.getElementById('meta').innerHTML = '<span class="pill">Game v' + esc(D.game.version) + ' · ' + D.recipes.length + ' recipes</span><span class="pill" id="busy"><i class="dot"></i>Planning…</span><span class="hist"><button type="button" data-act="undo" aria-label="Undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4L3 7l3 3"/><path d="M3 7h6.5a3.5 3.5 0 010 7H8"/></svg></button><button type="button" data-act="redo" aria-label="Redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4l3 3-3 3"/><path d="M13 7H6.5a3.5 3.5 0 000 7H8"/></svg></button></span><span class="pill" id="sync"><i class="dot"></i>Saved here</span><button type="button" class="hdr-btn" data-act="splitter" title="Split or merge belts evenly">⑂ Split / merge</button>';
    var shared = importShared();
    renderSetup(); applyPane(); schedulePlan(); initSync(); updateHistBtns();
    if (shared) toast(shared);
  }).catch(function (err) {
    document.getElementById('plan').innerHTML = '<div class="banner bad">Couldn’t load the recipe data (' + esc(err.message) + '). Reload to try again.</div>';
  });
})();
</script>
