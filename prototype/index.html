<style>
  :root {
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --base: #050509;
    --glow1: #2F3BFF;
    --glow2: #7A2CFF;
    --ink: #F2F0FF;
    --muted: #A9A6C4;
    --line: rgba(255, 255, 255, 0.12);
    --line-strong: rgba(255, 255, 255, 0.28);
    --panel: #0D0D16;
    --panel-2: #171728;
    --sel: #3A47FF;
  }
  [data-palette="pink"] { --base: #07040B; --glow1: #7B2CFF; --glow2: #FF2E93; --sel: #C2338A; }
  [data-theme="light"] {
    --base: #D9DCF6; --glow1: #8E97FF; --glow2: #B49BFF;
    --ink: #0E0B26; --muted: #46426B;
    --line: rgba(14, 11, 38, 0.14); --line-strong: rgba(14, 11, 38, 0.32);
    --panel: #F4F2FF; --panel-2: #E4E2F6;
  }
  [data-theme="light"][data-palette="pink"] {
    --base: #F2D3E8; --glow1: #E59BD0; --glow2: #C9A0FF;
    --ink: #1A0814; --muted: #5A344F;
    --line: rgba(26, 8, 20, 0.14); --line-strong: rgba(26, 8, 20, 0.32);
    --panel: #FFF4FA; --panel-2: #F4DDEC;
  }

  /* What each scene does to the whole page: background, glows, header colour */
  body {
    --page: var(--base); --chrome: var(--ink); --chrome-muted: var(--muted);
    --g1: var(--glow1); --g2: var(--glow2); --g-o: 0.75;
    --b1x: -46vw; --b1y: -50vh; --b2x: 46vw; --b2y: 50vh;
  }
  body[data-scene="ghost-line"] { --page: #04050A; --chrome: #EEF1FF; --chrome-muted: #9BA3C2; --g1: #26346F; --g2: #0B1028; --g-o: 0.75; --b1x: 0vw; --b1y: -48vh; --b2x: 30vw; --b2y: 40vh; }
  body[data-scene="shadow"] { --page: #EFB3D4; --chrome: #160A12; --chrome-muted: #5C2E4A; --g1: #FAD7EA; --g2: #D47FB0; --g-o: 0.9; --b1x: -30vw; --b1y: -30vh; --b2x: 36vw; --b2y: 38vh; }
  body[data-scene="phantom"] { --page: #040822; --chrome: #EEF2FF; --chrome-muted: #9EAAD6; --g1: #1C3AD0; --g2: #0B1666; --g-o: 0.75; --b1x: 0vw; --b1y: 46vh; --b2x: -40vw; --b2y: -40vh; }
  body[data-scene="linkfuse"] { --page: #07070C; --chrome: #E6EAF5; --chrome-muted: #9AA1B8; --g1: #5161A6; --g2: #2C3158; --g-o: 0.55; --b1x: -34vw; --b1y: 34vh; --b2x: 38vw; --b2y: -36vh; }
  body[data-scene="static"] { --page: #050407; --chrome: #F5F5FF; --chrome-muted: #A6A3BC; --g1: #3443FF; --g2: #FF2E93; --g-o: 0.5; --b1x: -48vw; --b1y: 0vh; --b2x: 50vw; --b2y: 6vh; }
  body[data-scene="halo"] { --page: #020207; --chrome: #EEF3FF; --chrome-muted: #97A3C9; --g1: #1B36E0; --g2: #060C3A; --g-o: 0.5; --b1x: 0vw; --b1y: 0vh; --b2x: 0vw; --b2y: 50vh; }

  * { box-sizing: border-box; }
  /* The rail shows where you are, so the plain browser scrollbar is hidden */
  html { background: #050509; scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }
  .scene ::selection { background: var(--accent, var(--sel)); color: #0B0B14; }
  .scene-shadow ::selection { background: #160A12; color: #F7D3E6; }
  html.lenis, html.lenis body { height: auto; }
  .lenis.lenis-smooth { scroll-behavior: auto !important; }
  .lenis.lenis-stopped { overflow: hidden; }
  html.morph body { transition: none; }
  body {
    margin: 0;
    background-color: var(--page);
    color: var(--ink);
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.9s var(--ease-in-out);
  }
  ::selection { background: var(--sel); color: #fff; }
  :focus-visible { outline: 2px solid currentColor; outline-offset: 3px; border-radius: 6px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Fixed atmosphere */
  .blob {
    position: fixed; left: 50%; top: 50%;
    width: 80vmax; height: 80vmax; margin: -40vmax 0 0 -40vmax;
    border-radius: 50%; pointer-events: none;
    -webkit-mask-image: radial-gradient(closest-side, #000, transparent);
    mask-image: radial-gradient(closest-side, #000, transparent);
    opacity: var(--g-o);
    transition: background-color 1s var(--ease-in-out), transform 1.4s var(--ease-in-out), opacity 1s var(--ease-in-out);
  }
  html:not(.loaded) .blob { transition: none; }
  .blob.b1 { background-color: var(--g1); transform: translate(var(--b1x), var(--b1y)); }
  .blob.b2 { background-color: var(--g2); transform: translate(var(--b2x), var(--b2y)); }
  #field { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  /* GPU effect behind a scene's title (Shaders library). Edges fade so no seam shows while scrolling. */
  .fx {
    position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0;
    opacity: 0; transition: opacity 1.4s var(--ease-out);
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 18%, #000 82%, transparent);
    mask-image: linear-gradient(180deg, transparent, #000 18%, #000 82%, transparent);
  }
  .fx.on { opacity: var(--fx-o, 1); }

  /* Extra grain that only shows around the cursor, like light raking across film */
  .grain.reveal {
    inset: 0; width: 100%; height: 100%; z-index: 49;
    background-image: var(--grain-color); opacity: 0.55;
    animation: grain-shift 0.6s steps(5) infinite;
    -webkit-mask-image: radial-gradient(circle 190px at var(--mx, -500px) var(--my, -500px), #000, transparent);
    mask-image: radial-gradient(circle 190px at var(--mx, -500px) var(--my, -500px), #000, transparent);
  }
  body[data-scene="shadow"] .grain.reveal,
  [data-theme="light"] body[data-scene="intro"] .grain.reveal,
  [data-theme="light"] body[data-scene="outro"] .grain.reveal { background-image: var(--grain-mono); opacity: 0.4; }
  @keyframes grain-shift { 0% { background-position: 0 0; } 20% { background-position: -37px 21px; } 40% { background-position: 53px -18px; } 60% { background-position: -12px 44px; } 80% { background-position: 29px 9px; } 100% { background-position: -41px -33px; } }
  @media (hover: none), (pointer: coarse) { .grain.reveal { display: none; } }

  /* Album-cover layering: the world's name, huge and faint, drifting far behind */
  .ghost-word {
    position: absolute; left: 50%; top: 50%; z-index: 0;
    font-size: clamp(150px, 30vw, 520px); line-height: 1; white-space: nowrap;
    color: transparent; -webkit-text-stroke: 1px currentColor; opacity: 0.07;
    pointer-events: none; user-select: none;
    transform: translate(-56%, -50%);
    animation: word-drift 40s ease-in-out infinite alternate;
  }
  @keyframes word-drift { to { transform: translate(-44%, -50%); } }
  .scene-shadow .ghost-word { opacity: 0.09; }
  /* Album-cover small print: the project's share link, click to copy */
  .credit {
    position: absolute; z-index: 2; bottom: clamp(28px, 7vh, 72px);
    display: grid; gap: 6px; padding: 0; border: 0; background: none; color: inherit; cursor: pointer; text-align: left;
    font: 600 10.5px/1 'Hanken Grotesk', sans-serif; letter-spacing: 0.24em; text-transform: uppercase; opacity: 0.55;
    transition: opacity 0.2s ease;
  }
  .credit span { font-weight: 500; letter-spacing: 0.16em; opacity: 0.8; }
  .credit.at-left { left: clamp(20px, 5vw, 72px); }
  .credit.at-right { right: clamp(130px, 12vw, 190px); text-align: right; }
  @media (hover: hover) and (pointer: fine) { .credit:hover { opacity: 1; } }
  /* Scene textures live on fixed layers and fade by weight, so no section edge ever shows.
     While scrolling, the script sets the weights continuously; otherwise these fallbacks apply. */
  @property --w-mono { syntax: '<number>'; inherits: true; initial-value: 0; }
  @property --w-shadow { syntax: '<number>'; inherits: true; initial-value: 0; }
  @property --w-static { syntax: '<number>'; inherits: true; initial-value: 0; }
  body { transition: background-color 0.9s var(--ease-in-out), --w-mono 0.8s ease, --w-shadow 0.8s ease, --w-static 0.8s ease; }
  body[data-scene="shadow"] { --w-mono: 1; --w-shadow: 1; }
  body[data-scene="static"], body[data-scene="poltergeist"] { --w-static: 1; }
  [data-theme="light"] body[data-scene="intro"], [data-theme="light"] body[data-scene="outro"] { --w-mono: 1; }
  .grain {
    position: fixed; inset: -50%; width: 200%; height: 200%;
    pointer-events: none; z-index: 50;
    background-image: var(--grain-color);
    opacity: calc(0.2 * (1 - var(--w-mono)));
    animation: grain 0.9s steps(6) infinite;
  }
  .grain.mono { background-image: var(--grain-mono); opacity: calc(0.18 * var(--w-mono)); animation-delay: -0.45s; }
  .tex { position: fixed; pointer-events: none; }
  .tex-paper { inset: 0; background-image: var(--paper); opacity: calc(0.5 * var(--w-shadow)); }
  .tex-static { inset: -50%; width: 200%; height: 200%; background-image: var(--static); opacity: calc(0.3 * var(--w-static)); animation: grain 0.5s steps(4) infinite; }
  .tex-tear { left: 0; right: 0; top: 0; height: 9vh; background-image: var(--static); opacity: 0; }
  body[data-scene="static"] .tex-tear { animation: tear 4.2s steps(1) infinite; }
  @keyframes grain {
    0% { transform: translate(0, 0); } 20% { transform: translate(-4%, 3%); } 40% { transform: translate(3%, -5%); }
    60% { transform: translate(-2%, 4%); } 80% { transform: translate(5%, 1%); } 100% { transform: translate(-3%, -2%); }
  }

  /* Header and project rail */
  .top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px clamp(20px, 4vw, 48px);
    color: var(--chrome); transition: color 0.6s ease;
    pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .brand {
    font: 600 15px/1 'Unbounded', sans-serif; letter-spacing: 0.5em; margin-right: -0.5em;
    color: inherit; text-decoration: none; background: none; border: 0; padding: 6px 0; cursor: pointer;
    transition: opacity 0.4s var(--ease-out), transform 0.4s var(--ease-out);
  }
  body[data-scene="intro"] .brand, body[data-scene="outro"] .brand { opacity: 0; transform: translateY(-6px); pointer-events: none; }
  .top-right { position: relative; display: flex; align-items: center; gap: 10px; }
  .sound-hint {
    position: absolute; right: calc(100% + 12px); top: 50%; transform: translate(6px, -50%);
    white-space: nowrap; pointer-events: none;
    font: 600 10.5px/1 'Hanken Grotesk', sans-serif; letter-spacing: 0.22em; text-transform: uppercase;
    opacity: 0; transition: opacity 0.5s var(--ease-out), transform 0.5s var(--ease-out);
  }
  .sound-hint.show { opacity: 0.7; transform: translate(0, -50%); }
  @media (max-width: 700px) { .sound-hint { display: none; } }

  /* Category tabs: Games / Apps / Remixes */
  .tabs {
    position: absolute; left: 50%; top: 20px; transform: translateX(-50%);
    display: flex; gap: 2px; padding: 4px; border-radius: 999px;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 16%, transparent);
    transition: opacity 0.4s var(--ease-out), transform 0.4s var(--ease-out);
  }
  .tabs button {
    position: relative; z-index: 1; border: 0; background: none; color: inherit; cursor: pointer;
    padding: 10px 16px; font: 600 11px/1 'Hanken Grotesk', sans-serif; letter-spacing: 0.24em; text-transform: uppercase;
    opacity: 0.6; transition: opacity 0.2s ease;
  }
  .tabs button[aria-pressed="true"] { opacity: 1; }
  @media (hover: hover) and (pointer: fine) { .tabs button:hover { opacity: 1; } }
  .tabs .ind {
    position: absolute; left: 0; top: 4px; bottom: 4px; width: 100px; border-radius: 999px;
    background: color-mix(in srgb, currentColor 12%, transparent);
    transform-origin: left; transition: transform 0.35s var(--ease-out), width 0.35s var(--ease-out);
  }
  body[data-scene="intro"] .tabs { opacity: 0; transform: translate(-50%, -6px); pointer-events: none; }

  /* Title-screen choices under the STEZY name */
  .choices {
    position: absolute; left: 0; right: 0; top: calc(46% + min(14vw, 28vh) * 0.42 + 84px); padding: 0 20px;
  }
  .choices-row { display: flex; justify-content: center; flex-wrap: wrap; gap: clamp(18px, 4vw, 56px); }
  .choices button {
    position: relative; border: 0; background: none; color: var(--ink); cursor: pointer; padding: 10px 0;
    font: 800 clamp(15px, 1.6vw, 22px)/1 'Unbounded', sans-serif; letter-spacing: 0.3em; margin-right: -0.3em; text-transform: uppercase;
    opacity: 0.5; transition: opacity 0.25s var(--ease-out), transform 0.25s var(--ease-out);
  }
  .choices button::after {
    content: ""; position: absolute; left: 0; right: 0.3em; bottom: 0; height: 1.5px; background: currentColor;
    transform: scaleX(0); transform-origin: left; transition: transform 0.35s var(--ease-out);
  }
  .choices button[aria-pressed="true"] { opacity: 1; }
  .choices button[aria-pressed="true"]::after { transform: scaleX(1); }
  @media (hover: hover) and (pointer: fine) { .choices button:hover { opacity: 1; transform: translateY(-2px); } }

  /* Switching tabs: the page dips out while the particles write the tab's name */
  main { transition: opacity 0.25s var(--ease-out); }
  .switching main, .switching .rail { opacity: 0; }

  /* Music toggle: three small bars that dance while the loop plays */
  .sound .bars { display: flex; align-items: flex-end; gap: 2.5px; height: 14px; }
  .sound .bars i { width: 2.5px; height: 3px; border-radius: 2px; background: currentColor; transition: height 0.3s var(--ease-out); }
  .sound[aria-pressed="true"] .bars i { animation: bar 1s ease-in-out infinite; }
  .sound[aria-pressed="true"] .bars i:nth-child(2) { animation-delay: -0.35s; }
  .sound[aria-pressed="true"] .bars i:nth-child(3) { animation-delay: -0.7s; }
  @keyframes bar { 0%, 100% { height: 4px; } 50% { height: 14px; } }

  /* Remixes: a slowly spinning record behind each mod's title */
  .vinyl-wrap { position: absolute; left: 68%; top: 47%; width: min(78vh, 58vw); aspect-ratio: 1; transform: translate(-50%, -50%); z-index: 0; pointer-events: none; }
  .vinyl {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle, #050507 0 1.1%, var(--label) 1.3% 16%, #08080c 16.3% 17.5%, transparent 17.8%),
      repeating-radial-gradient(circle, #0b0b10 0 2px, #17171f 2.6px 3.6px);
    box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.85), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    animation: spin 9s linear infinite;
  }
  .vinyl span { position: absolute; left: 50%; top: 41%; transform: translateX(-50%); font: 600 clamp(8px, 0.8vw, 11px)/1 'Hanken Grotesk', sans-serif; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(255, 255, 255, 0.85); white-space: nowrap; }
  .vinyl-sheen { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 20deg, transparent 0 18%, rgba(255,255,255,.07) 24%, transparent 30% 68%, rgba(255,255,255,.05) 74%, transparent 80%); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .scene-remix { color: #F3F1FF; align-items: flex-start; }
  .t-remix { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(54px, 8.5vw, 150px); line-height: 0.95; letter-spacing: -0.01em; text-shadow: 0 6px 40px rgba(0, 0, 0, 0.6); max-width: 9ch; }
  .made-by { display: block; margin-top: 8px; font-size: 13px; opacity: 0.7; letter-spacing: 0.04em; text-transform: none; }
  .cv-vinyl { background: radial-gradient(circle, #050507 0 0.8%, var(--label) 1% 13%, #08080c 13.2% 14%, transparent 14.2%), repeating-radial-gradient(circle, #0b0b10 0 1.5px, #17171f 2px 3px); color: #F3F1FF; }
  .cv-vinyl .small { color: rgba(243,241,255,.6); }
  .art-vinyl { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 12cqi; line-height: 1; text-shadow: 0 2px 16px rgba(0,0,0,.85); }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center;
    border: 0; background: transparent; color: inherit;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 30%, transparent);
    font-size: 19px; cursor: pointer;
    transition: background-color 0.2s ease, transform 0.14s var(--ease-out);
  }
  .icon-btn:active { transform: scale(0.94); }
  @media (hover: hover) and (pointer: fine) { .icon-btn:hover { background: color-mix(in srgb, currentColor 12%, transparent); } }

  .rail {
    position: fixed; right: clamp(16px, 3vw, 40px); top: 50%; transform: translateY(-50%); z-index: 30;
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    color: var(--chrome-muted); transition: color 0.6s ease;
  }
  .rail button {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 0; border: 0; background: none; color: inherit; cursor: pointer;
    font: 600 11px/1 'Hanken Grotesk', sans-serif; letter-spacing: 0.24em; text-transform: uppercase;
    transition: color 0.3s ease;
  }
  .rail button::after {
    content: ""; width: 24px; height: 1.5px; background: currentColor; border-radius: 2px;
    transform: scaleX(0.34); transform-origin: right; transition: transform 0.35s var(--ease-out);
  }
  .rail button[aria-current="true"] { color: var(--chrome); }
  .rail button[aria-current="true"]::after { transform: scaleX(1); }
  @media (hover: hover) and (pointer: fine) { .rail button:hover { color: var(--chrome); } }

  /* Scenes */
  .scene {
    position: relative; min-height: 100dvh;
    display: flex; flex-direction: column; justify-content: center;
    padding: 96px clamp(20px, 5vw, 72px) 200px;
    overflow: hidden;
  }
  /* Sections of other tabs are hidden for real (the flex layout would otherwise override [hidden]) */
  .scene[hidden] { display: none !important; }
  .scene .title { margin: 0; font-weight: 400; position: relative; z-index: 1; will-change: transform, opacity; }
  .js .scene .title { opacity: 0; transform: translateY(0.1em) scale(0.985); transition: opacity 0.6s var(--ease-out), transform 0.9s var(--ease-out); }
  .js .scene.is-active .title { opacity: 1; transform: none; }
  /* Each world enters its own way */
  /* Names are split into letters (.word > .ch, --i = order, --r = random 0-1) or halves (.half), and each picks an entrance */
  .title .word { display: inline-block; white-space: nowrap; }
  .title .ch, .title .half { display: inline-block; }
  .js .scene .title.split { transform: none; transition: opacity 0.25s var(--ease-out); }
  /* Smoke: each letter condenses out of drifting haze */
  .scene.is-active .enter-smoke .ch { animation: smoke-in 1.5s var(--ease-out) calc(var(--r) * 650ms) both; }
  @keyframes smoke-in {
    from { opacity: 0; filter: blur(0.14em); transform: translate(calc((var(--r) - 0.5) * 0.5em), 0.3em) scale(1.25, 1.45); }
    55% { opacity: 1; }
    to { opacity: 1; filter: none; transform: none; }
  }
  /* Stamp: letters slam onto the paper one after another, then the whole word shudders */
  .scene.is-active .enter-stamp .ch { animation: stamp-in 0.36s calc(0.1s + var(--i) * 85ms) both; }
  @keyframes stamp-in {
    from { opacity: 0; transform: scale(2.4) rotate(calc((var(--r) - 0.5) * 26deg)); animation-timing-function: cubic-bezier(0.55, 0, 0.9, 0.45); }
    70% { opacity: 1; transform: scale(0.95); animation-timing-function: var(--ease-out); }
    to { opacity: 1; transform: none; }
  }
  .scene.is-active .enter-stamp { animation: thud 0.34s ease-out calc(0.35s + var(--n) * 85ms) both; }
  @keyframes thud { 0%, 100% { translate: 0 0; } 25% { translate: -0.014em 0.022em; } 50% { translate: 0.012em -0.01em; } 75% { translate: -0.005em 0.008em; } }
  /* Neon: letters flicker on like bulbs warming up, flare once, then glow steady */
  .scene.is-active .enter-neon .ch { animation: neon-in 1.4s steps(1, end) calc(0.1s + var(--r) * 750ms) both; }
  @keyframes neon-in {
    0% { opacity: 0; }
    6% { opacity: 0.85; } 9% { opacity: 0.06; } 16% { opacity: 0.95; } 19% { opacity: 0.18; }
    36% { opacity: 1; text-shadow: 0 0 0.1em #fff, 0 0 0.45em rgba(150, 180, 255, 0.95); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
    100% { opacity: 1; text-shadow: none; }
  }
  /* Fuse: the two halves zip in from opposite sides and spark where they meet */
  .enter-fuse .half { position: relative; }
  .scene.is-active .enter-fuse .half:first-child { animation: zip-l 0.62s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both; }
  .scene.is-active .enter-fuse .half:last-child { animation: zip-r 0.62s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both; }
  @keyframes zip-l { from { opacity: 0; transform: translateX(-70vw) skewX(-24deg); } 40% { opacity: 1; } to { opacity: 1; transform: none; } }
  @keyframes zip-r { from { opacity: 0; transform: translateX(70vw) skewX(-24deg); } 40% { opacity: 1; } to { opacity: 1; transform: none; } }
  .enter-fuse .half:first-child::after {
    content: ""; position: absolute; right: -0.28em; top: 50%; width: 0.56em; height: 0.56em; margin-top: -0.2em; border-radius: 50%;
    background: radial-gradient(closest-side, #fff, rgba(205, 220, 255, 0.7) 35%, transparent); opacity: 0; pointer-events: none;
  }
  .scene.is-active .enter-fuse .half:first-child::after { animation: spark 0.6s var(--ease-out) 0.5s both; }
  @keyframes spark { 0% { opacity: 0; transform: scale(0.2); } 25% { opacity: 1; transform: scale(1.5); } 100% { opacity: 0; transform: scale(2.6); } }
  /* Blocks: letters drop in one at a time and land with a squash, like placing blocks */
  .scene.is-active .enter-blocks .ch { transform-origin: 50% 100%; animation: block-drop 0.64s calc(0.1s + var(--i) * 60ms + var(--r) * 70ms) both; }
  @keyframes block-drop {
    0% { opacity: 0; transform: translateY(-0.85em); animation-timing-function: cubic-bezier(0.5, 0, 1, 0.6); }
    30% { opacity: 1; }
    55% { transform: translateY(0) scale(1.14, 0.8); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
    78% { transform: translateY(-0.08em) scale(0.96, 1.05); animation-timing-function: ease-in-out; }
    100% { opacity: 1; transform: none; }
  }
  .js .scene-halo .title { transform: scale(0.94); transition: opacity 1.4s var(--ease-out), transform 1.4s var(--ease-out); }
  .js .scene-static .title { transform: none; transition: opacity 0.1s linear; }
  .js .scene-static.is-active .title { animation: glitch-in 0.5s steps(1); }
  @keyframes glitch-in {
    0% { transform: translateX(-6%) skewX(-12deg); }
    15% { transform: translateX(4%) skewX(8deg); }
    30% { transform: translateX(-2%); }
    45% { transform: translateX(1%) skewX(-3deg); }
    60%, 100% { transform: none; }
  }
  .js .scene.is-active .title { opacity: 1; transform: none; }

  /* Entrance intro: hide the chrome until the particles have written the name */
  .top, .rail, .tagline, .choices, .demo-bar { transition: opacity 0.8s var(--ease-out); }
  .intro-play .top, .intro-play .rail, .intro-play .tagline, .intro-play .choices, .intro-play .demo-bar, .intro-play .blob { opacity: 0 !important; }
  .tagline { transition-delay: 0.05s; }
  .choices { transition-delay: 0.15s; }
  .rail { transition-delay: 0.2s; }
  .top { transition: color 0.6s ease, opacity 0.8s var(--ease-out) 0.3s; }
  .demo-bar { transition-delay: 0.45s; }
  .info { position: absolute; z-index: 2; bottom: clamp(28px, 7vh, 72px); max-width: 420px; }
  .info.at-left { left: clamp(20px, 5vw, 72px); }
  .info.at-right { right: clamp(130px, 12vw, 190px); text-align: right; }
  .info.at-center { left: 0; right: 0; margin: 0 auto; text-align: center; }
  .js .info > * { opacity: 0; transform: translateY(14px); transition: opacity 0.45s var(--ease-out), transform 0.45s var(--ease-out); }
  .js .scene.is-active .info > * { opacity: 1; transform: none; }
  .js .scene.is-active .info > :nth-child(1) { transition-delay: 0.15s; }
  .js .scene.is-active .info > :nth-child(2) { transition-delay: 0.21s; }
  .js .scene.is-active .info > :nth-child(3) { transition-delay: 0.27s; }
  .credits { margin: 0; font-weight: 600; font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.72; }
  .desc { margin: 10px 0 0; font-size: clamp(16px, 1.3vw, 19px); line-height: 1.5; }
  .info.at-center .desc { margin-left: auto; margin-right: auto; max-width: 38ch; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .at-right .actions { justify-content: flex-end; }
  .at-center .actions { justify-content: center; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    height: 50px; padding: 0 24px; border-radius: 999px; border: 0;
    font: 700 15px/1 'Hanken Grotesk', sans-serif; text-decoration: none; white-space: nowrap; cursor: pointer;
    transition: transform 0.14s var(--ease-out), background-color 0.2s ease, box-shadow 0.2s ease;
  }
  .btn i { font-size: 18px; }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); color: var(--accent-ink, #0B0B14); }
  .btn.ghost { background: transparent; color: inherit; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, currentColor 38%, transparent); }
  @media (hover: hover) and (pointer: fine) {
    .btn.primary:hover { box-shadow: 0 10px 24px -10px rgba(0, 0, 0, 0.55); }
    .btn.ghost:hover { background: color-mix(in srgb, currentColor 10%, transparent); }
  }

  /* Intro and outro: the particles write the name */
  .scene-intro, .scene-outro { color: var(--ink); align-items: center; text-align: center; }
  .js .intro-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .intro-title { font: 800 clamp(56px, 15vw, 220px)/1 'Unbounded', sans-serif; letter-spacing: 0.2em; margin: 0; }
  .tagline {
    position: absolute; left: 0; right: 0; top: calc(46% + min(14vw, 28vh) * 0.42 + 24px);
    margin: 0; padding: 0 20px; font-size: clamp(17px, 1.5vw, 21px); line-height: 1.5; color: var(--muted);
  }
  .tagline strong { color: var(--ink); font-weight: 600; }
  #tag-text { display: inline-block; transition: opacity 0.2s var(--ease-out), transform 0.2s var(--ease-out); }
  #tag-text.out { opacity: 0; transform: translateY(6px); }
  .scroll-cue { display: block; width: 1.5px; height: 46px; margin: 30px auto 0; border-radius: 2px; overflow: hidden; background: color-mix(in srgb, var(--ink) 16%, transparent); }
  .scroll-cue::after { content: ""; display: block; width: 100%; height: 40%; border-radius: 2px; background: var(--ink); animation: cue 1.9s var(--ease-in-out) infinite; }
  @keyframes cue { 0% { transform: translateY(-100%); } 70%, 100% { transform: translateY(260%); } }
  /* Particle writer: type in the outro and the particles write it */
  .writer {
    position: absolute; left: 0; right: 0; top: calc(46% + min(14vw, 28vh) * 0.42 + 26px); z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 0 20px;
  }
  .writer-box {
    display: flex; align-items: center; width: min(440px, 100%); height: 54px; padding: 0 6px 0 22px; border-radius: 999px;
    box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ink) 26%, transparent);
    background: color-mix(in srgb, var(--base) 35%, transparent); backdrop-filter: blur(6px);
    transition: box-shadow 0.2s var(--ease-out);
  }
  .writer-box:focus-within { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ink) 70%, transparent); }
  .writer-input {
    flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--ink); text-align: center;
    font: 800 16px/1 'Unbounded', sans-serif; letter-spacing: 0.28em; text-transform: uppercase; padding-left: 40px;
  }
  .writer-input::placeholder { color: var(--muted); opacity: 0.8; }
  .writer-share {
    flex: none; display: grid; place-items: center; width: 42px; height: 42px; border: 0; border-radius: 50%;
    background: var(--ink); color: var(--base); cursor: pointer; font-size: 18px;
    transition: opacity 0.2s var(--ease-out), transform 0.2s var(--ease-out);
  }
  .writer-share:disabled { opacity: 0; transform: scale(0.6); pointer-events: none; }
  .writer-share:active { transform: scale(0.94); }
  .writer-share:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .writer-hint { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
  .outro-text { position: absolute; left: 0; right: 0; bottom: clamp(32px, 8vh, 80px); padding: 0 20px; }
  .outro-text p { margin: 0 auto; max-width: 44ch; font-size: clamp(17px, 1.5vw, 21px); line-height: 1.5; }
  .outro-text .fine { margin-top: 18px; font-size: 13px; color: var(--muted); }
  .outro-next { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 0 0 22px; }
  .outro-next .btn { height: 44px; padding: 0 20px; font-size: 14px; color: var(--ink); }
  .outro-text .outro-line {
    margin: 0 auto; max-width: none;
    font: 800 clamp(16px, 1.7vw, 24px)/1.2 'Unbounded', sans-serif; letter-spacing: 0.34em; margin-right: -0.34em; text-transform: uppercase;
  }

  /* Ghost Line: smoke made of grain */
  .scene-ghost-line { color: #EEF1FF; align-items: center; text-align: center; --accent: #D6E0FF; }
  .t-smoke { font-family: 'Anton', sans-serif; font-size: clamp(88px, 16vw, 280px); line-height: 0.88; text-transform: uppercase; filter: url(#f-smoke-lg); padding: 0.06em 0.1em; }

  /* Shadow: ink bleed on pink paper */
  .scene-shadow { color: #160A12; --accent: #160A12; --accent-ink: #F7D3E6; }
  .t-ink { font-family: 'Grenze Gotisch', serif; font-weight: 900; font-size: clamp(110px, 21vw, 360px); line-height: 0.95; filter: url(#f-ink-lg); margin-left: -0.04em; }

  /* Phantom: melted glow under stars */
  .scene-phantom { color: #EEF2FF; align-items: center; text-align: center; --accent: #A9C0FF; }
  .t-melt { font-family: 'Bagel Fat One', sans-serif; font-size: clamp(90px, 15vw, 260px); line-height: 1; color: #F3EEFF; filter: url(#f-melt-lg); }

  /* LinkFuse: chrome script */
  .scene-linkfuse { color: #E6EAF5; align-items: flex-end; text-align: right; --accent: #E3E8F4; }
  .t-chrome {
    font-family: 'Pinyon Script', cursive; font-size: clamp(96px, 13.5vw, 250px); line-height: 1.3; padding: 0 0.12em;
    filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.75));
    margin-right: clamp(150px, 15vw, 240px);
  }
  .t-chrome .half {
    padding: 0.2em 0.24em; margin: -0.2em -0.24em;
    background:
      linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.95) 50%, transparent 60%) 140% 0 / 260% 100% no-repeat,
      linear-gradient(180deg, #FFFFFF 0%, #DCE4F4 30%, #6B7894 50%, #EEF3FC 60%, #9AA6C0 82%, #F4F7FF 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .js .scene-linkfuse .title .half { transition: background-position 1.3s var(--ease-in-out) 0.6s; }
  .js .scene-linkfuse .title .half:last-child { transition-delay: 0.85s; }
  .js .scene-linkfuse.is-active .title .half { background-position: -40% 0, 0 0; }
  .chrome-note { position: relative; z-index: 1; margin: -0.6em clamp(190px, 18vw, 290px) 0 0; max-width: 22ch; font-size: 13px; line-height: 1.45; color: rgba(230, 234, 245, 0.62); text-align: left; align-self: flex-end; }

  /* Poltergeist: letters levitating in the light of a TV full of static */
  .scene-poltergeist { color: #EEF0FF; align-items: center; text-align: center; --accent: #C9D4FF; }
  .t-float {
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: clamp(50px, 8.2vw, 158px); line-height: 1.05; letter-spacing: -0.01em;
    text-shadow: -0.025em 0 rgba(61, 90, 254, 0.75), 0.025em 0 rgba(255, 61, 154, 0.5), 0 0 0.4em rgba(170, 190, 255, 0.45);
  }
  .t-float::after {
    content: ""; position: absolute; left: 18%; right: 18%; bottom: -0.32em; height: 0.14em; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(170, 190, 255, 0.22), transparent); filter: blur(8px);
  }
  /* Levitate: letters rise off the floor at odd angles, then keep hovering */
  .scene.is-active .enter-levitate .ch {
    animation: lev-in 1.2s var(--ease-out) calc(0.1s + var(--r) * 550ms) both,
               hover-bob calc(2.4s + var(--r) * 1.6s) ease-in-out calc(1.3s + var(--r) * 700ms) infinite alternate;
  }
  @keyframes lev-in {
    from { opacity: 0; transform: translateY(0.55em) rotate(calc((var(--r) - 0.5) * 34deg)); filter: blur(0.05em); }
    40% { opacity: 1; }
    to { opacity: 1; transform: rotate(calc((var(--r) - 0.5) * 7deg)); filter: none; }
  }
  @keyframes hover-bob { from { translate: 0 -0.035em; } to { translate: 0 0.045em; } }

  /* Undertow: deep water, a serif that rolls like a swell */
  .scene-undertow { color: #E6F3FF; --accent: #A9DCFF; }
  .t-tide {
    font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: clamp(96px, 15vw, 280px); line-height: 0.95; padding: 0 0.08em 0.06em;
    color: #DDEFFF; filter: drop-shadow(0 0 0.25em rgba(80, 170, 255, 0.35));
  }
  .t-tide .ch { padding: 0 0.14em; margin: 0 -0.14em; background: linear-gradient(180deg, #FFFFFF 10%, #BFE3FF 46%, #3E8FE0 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  /* Wave: a swell rolls through the letters, then they keep rocking gently */
  .scene.is-active .enter-wave .ch {
    animation: wave-in 1s var(--ease-out) calc(0.1s + var(--i) * 70ms) both,
               swell 3.2s ease-in-out calc(1.1s + var(--i) * 180ms) infinite alternate;
  }
  @keyframes wave-in {
    from { opacity: 0; transform: translateY(0.45em) skewX(-8deg); }
    55% { opacity: 1; transform: translateY(-0.08em); }
    to { opacity: 1; transform: none; }
  }
  @keyframes swell { from { translate: 0 -0.025em; } to { translate: 0 0.035em; } }

  /* Veil: thin, widely spaced capitals behind frosted glass */
  .scene-veil { color: #EEEAFF; align-items: flex-end; text-align: right; --accent: #DCD2FF; }
  .t-veil {
    font-family: 'Italiana', serif; font-size: clamp(90px, 13vw, 250px); line-height: 1; letter-spacing: 0.2em; text-transform: uppercase; margin-right: clamp(210px, 19vw, 320px);
    text-shadow: 0 0 0.25em rgba(190, 170, 255, 0.45);
  }
  /* Unveil: each letter starts frosted and out of focus, then the veil slides off it */
  .scene.is-active .enter-unveil .ch {
    animation: unveil 1.5s var(--ease-out) calc(0.15s + var(--i) * 160ms) both;
  }
  @keyframes unveil {
    from { opacity: 0; filter: blur(0.12em); transform: translateY(-0.14em) scale(1.08); }
    30% { opacity: 0.6; }
    to { opacity: 1; filter: none; transform: none; }
  }

  /* Ignite: each brush stroke catches light, flares, then settles into a steady glow */
  .scene.is-active .enter-ignite .ch { animation: ignite 1.3s var(--ease-out) calc(0.15s + var(--i) * 180ms) both; }
  @keyframes ignite {
    from { opacity: 0; filter: brightness(0.3) blur(0.04em); transform: scale(0.92); }
    35% { opacity: 1; filter: brightness(1.8) blur(0); transform: scale(1.04); }
    to { opacity: 1; filter: none; transform: none; }
  }

  /* Afterimage: a warm serif that leaves ghost copies of itself, like a bright light behind closed eyes */
  .scene-afterimage { color: #FFF3F5; --accent: #FFC9DA; }
  .t-echo {
    font-family: 'DM Serif Display', serif; font-style: italic; text-transform: lowercase; font-size: clamp(76px, 11.5vw, 220px); line-height: 1.05;
    text-shadow: 0.05em 0.03em 0 rgba(255, 143, 184, 0.45), 0.1em 0.06em 0 rgba(255, 195, 143, 0.25);
  }
  /* Echo: each letter arrives trailing copies of itself, and the copies catch up */
  .scene.is-active .enter-echo .ch { animation: echo-in 1.3s var(--ease-out) calc(0.1s + var(--i) * 60ms) both; }
  @keyframes echo-in {
    from { opacity: 0; transform: translateX(-0.4em); text-shadow: 0.5em 0.2em 0 rgba(255, 143, 184, 0), 1em 0.4em 0 rgba(255, 195, 143, 0); }
    30% { opacity: 1; text-shadow: 0.3em 0.12em 0 rgba(255, 143, 184, 0.6), 0.6em 0.24em 0 rgba(255, 195, 143, 0.4); }
    to { opacity: 1; transform: none; text-shadow: 0.05em 0.03em 0 rgba(255, 143, 184, 0.45), 0.1em 0.06em 0 rgba(255, 195, 143, 0.25); }
  }

  /* Static: glitch and TV noise */
  .scene-static { color: #F5F5FF; --accent: #FF7CBE; }
  @keyframes tear { 0%, 84%, 100% { opacity: 0; transform: translateY(20vh); } 86% { opacity: 0.8; transform: translateY(44vh) translateX(-2vw); } 89% { opacity: 0.6; transform: translateY(62vh) translateX(1.5vw); } 91% { opacity: 0; } }
  .t-glitch {
    font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 125%;
    font-size: clamp(80px, 14vw, 240px); line-height: 1; text-transform: uppercase;
    text-shadow: -0.04em 0 #3D5AFE, 0.04em 0 #FF3D9A;
  }
  .t-glitch::before, .t-glitch::after { content: attr(data-text); position: absolute; inset: 0; clip-path: inset(0 0 100% 0); }
  .t-glitch::before { text-shadow: -0.06em 0 #3D5AFE; }
  .t-glitch::after { text-shadow: 0.06em 0 #FF3D9A; }
  .scene-static.is-active .t-glitch::before { animation: slice-a 3.4s steps(1) infinite; }
  .scene-static.is-active .t-glitch::after { animation: slice-b 3.4s steps(1) infinite; }
  @keyframes slice-a { 0%, 86%, 100% { clip-path: inset(0 0 100% 0); transform: none; } 88% { clip-path: inset(18% 0 58% 0); transform: translateX(-0.12em); } 92% { clip-path: inset(62% 0 12% 0); transform: translateX(0.1em); } }
  @keyframes slice-b { 0%, 87%, 100% { clip-path: inset(0 0 100% 0); transform: none; } 89% { clip-path: inset(40% 0 38% 0); transform: translateX(0.14em); } 93% { clip-path: inset(8% 0 80% 0); transform: translateX(-0.08em); } }

  /* Halo: glowing brush inside a ring of light */
  .scene-halo { color: #EEF3FF; align-items: center; text-align: center; --accent: #9FB8FF; }
  .t-halo {
    font-family: 'Caveat Brush', cursive; font-size: clamp(130px, 22vw, 380px); line-height: 1; text-transform: lowercase;
    text-shadow: 0 0 0.02em #fff, 0 0 0.08em #4D7BFF, 0 0 0.2em #2447FF, 0 0 0.45em rgba(36, 71, 255, 0.55);
    filter: url(#f-sketch-lg);
  }

  .sample-tag { display: inline-block; margin-left: 0.6em; padding: 0.35em 0.7em; border-radius: 999px; font-size: 10px; letter-spacing: 0.16em; box-shadow: inset 0 0 0 1px currentColor; vertical-align: 0.1em; }

  /* Sparkles */
  .spark {
    position: absolute; width: var(--w, 16px); aspect-ratio: 1; pointer-events: none;
    background:
      linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent) center / 100% 1.5px no-repeat,
      linear-gradient(0deg, transparent, rgba(255,255,255,.95), transparent) center / 1.5px 100% no-repeat,
      radial-gradient(closest-side, rgba(255,255,255,.95), rgba(190,210,255,.35) 45%, transparent) center / 34% 34% no-repeat;
    animation: twinkle var(--t, 4s) ease-in-out infinite var(--d, 0s);
  }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(18deg); } }

  /* Detail view covers (each project's art at card size) */
  .cover { position: relative; isolation: isolate; overflow: hidden; aspect-ratio: var(--r, 1); border-radius: 16px; display: grid; place-items: center; container-type: inline-size; }

  // ---------- Lettering effects (SVG filters) in three sizes ----------

      <feDisplacementMap in="SourceGraphic" in2="n" scale="${5 * k}" xChannelSelector="R" yChannelSelector="G" result="rough"/>

  // ---------- Noise tiles (transparency baked in, so no costly blend modes while scrolling) ----------
  function noiseTile(size, mode) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    const img = x.createImageData(size, size);
    const tints = [[70, 110, 255], [255, 70, 170], [150, 80, 255], [225, 228, 255]];
    for (let i = 0; i < img.data.length; i += 4) {
      let r, g, b, a;
      if (mode === 'color' || mode === 'static') {
        const on = Math.random() < (mode === 'static' ? 0.7 : 0.55);
        [r, g, b] = tints[(Math.random() * tints.length) | 0];
        a = on ? Math.random() * 255 : 0;
      } else if (mode === 'paper') {
        r = 70; g = 22; b = 52; a = Math.random() < 0.6 ? Math.random() * 130 : 0;
      } else {
        r = 18; g = 12; b = 34; a = Math.random() * 255;
      }
      img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; img.data[i + 3] = a;
    }
    x.putImageData(img, 0, 0);
    return `url(${c.toDataURL()})`;
  }
  root.style.setProperty('--grain-color', noiseTile(220, 'color'));
  root.style.setProperty('--grain-mono', noiseTile(220, 'mono'));

  // ---------- The particle field: writes STEZY, then changes behaviour per scene ----------

      phantom: [[244, 247, 255], [140, 170, 255]],
      linkfuse: [[226, 231, 246], [140, 155, 215]],
      poltergeist: [[232, 236, 255], [150, 165, 255]],
      'afterimage': [[255, 236, 240], [255, 150, 185]],
      undertow: [[200, 232, 255], [70, 150, 240]],
      veil: [[236, 230, 255], [190, 160, 255]],
      static: [[255, 90, 175], [90, 120, 255]],
      halo: [[220, 230, 255], [80, 120, 255]],
      'schedule-steve': [[214, 246, 205], [110, 200, 90]],
      'midnight-pack': [[214, 224, 255], [120, 140, 255]],

    function brandColors() {
      const light = root.dataset.theme === 'light', pink = root.dataset.palette === 'pink';

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const hadSize = w > 0 && h > 0;
      w = innerWidth; h = innerHeight;

      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.max(1000, Math.min(5200, Math.round((w * h) / 230)));
      dots = Array.from({ length: n }, (_, i) => dots[i] || {
        x: Math.random() * w, y: Math.random() * h, vx: 0, vy: 0,
        r: 0.6 + Math.random() * 1.1, a: 0.25 + Math.random() * 0.5, s: 0.15 + Math.random() * 0.45,
        ph: Math.random() * Math.PI * 2, c: Math.random(), al: 0, z: Math.pow(Math.random(), 1.6),
        ring: 0.8 + Math.random() * 0.45, ang: Math.random() * Math.PI * 2, big: Math.random() < 0.1
      });
      // The near layer: a few big, very soft lights drifting in front of everything
      lights = Array.from({ length: 9 }, (_, i) => lights[i] || {
        x: Math.random() * w, y: Math.random() * h, r: 70 + Math.random() * 140,
        a: 0.04 + Math.random() * 0.06, vx: (Math.random() - 0.5) * 0.16, vy: (Math.random() - 0.5) * 0.1, c: i % 2
      });

    }

    // Draw a word off-screen, letter-spaced like the brand, and return its pixels in random order
    function wordPoints(text) {
      const off = document.createElement('canvas');
      off.width = w; off.height = h;
      const o = off.getContext('2d');
      let fs = w < 700 ? w * 0.165 : Math.min(w * 0.14, h * 0.28);
      const measure = (str, size) => {
        o.font = `800 ${size}px Unbounded`;
        const letters = [...str];
        const widths = letters.map(l => o.measureText(l).width);
        return { letters, widths, total: widths.reduce((s, v) => s + v, 0) + size * 0.2 * (letters.length - 1) };
      };
      const maxW = w * (w < 700 ? 0.9 : 0.74);
      // A long phrase that would get tiny on one line wraps onto two, growing upwards so nothing below moves
      let lines = [text];
      const one = measure(text, fs).total;
      if (one > maxW && fs * maxW / one < fs * 0.62) {
        const spaces = [...text].map((c, i) => (c === ' ' ? i : -1)).filter(i => i > 0);
        if (spaces.length) {
          const cut = spaces.reduce((a, b) => (Math.abs(b - text.length / 2) < Math.abs(a - text.length / 2) ? b : a));

        }
      }

      const widest = Math.max(...ms.map(m => m.total));

      o.fillStyle = '#fff';

      });

      const pts = [];
      for (let y = 0; y < h; y += 2) for (let xx = 0; xx < w; xx += 2) if (data[(y * w + xx) * 4 + 3] > 140) pts.push([xx, y]);
      for (let i = pts.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [pts[i], pts[j]] = [pts[j], pts[i]]; }
      return pts;
    }
    // Hand each particle a pixel of the word to fly to: the intro writes STEZY or the chosen tab, the outro always STEZY
    const words = { intro: 'STEZY', outro: 'STEZY' };
    const wordFor = m => (m === 'outro' ? words.outro : words.intro);
    let sampled = '';
    function useWord(word, force) {
      if (!ready || !w || !h || (word === sampled && !force)) return;

      dots.forEach((d, i) => {
        if (i < take) { d.tx = pts[i][0]; d.ty = pts[i][1]; d.has = true; }
        else d.has = false;
        if (reduce && KIND[mode] === 'form') { if (d.has) { d.x = d.tx; d.y = d.ty; } d.al = targetAlpha(d, 'form'); }
      });
      if (reduce) draw(0);
    }
    function sampleText() { useWord(wordFor(mode), true); }
    // which: 'intro' (STEZY or the chosen tab) or 'outro' (STEZY or whatever the visitor typed)
    function setWord(word, which = 'intro', kick = 6) {

          el.loop = true; el.volume = 0; el.preload = 'auto';
          mode = 'element';
        }
      })();
      return loading;
    }
    function rampElement(to, seconds) {
      cancelAnimationFrame(rafId);
      const from = el.volume, startAt = performance.now();
      const tick = now => {
        const k = Math.min(1, (now - startAt) / (seconds * 1000));
        el.volume = Math.max(0, Math.min(1, from + (to - from) * (1 - Math.pow(1 - k, 2))));
        if (k < 1) rafId = requestAnimationFrame(tick);
        else if (to === 0) el.pause();
      };
      rafId = requestAnimationFrame(tick);
    }
    async function play(firstTime) {
      on = true; ui(); hideHint();
      await load();
      if (!on) return;
      if (mode === 'buffer') {
        clearTimeout(suspendTimer);
        if (ctx.state === 'suspended') await ctx.resume();
        if (!source) {
          const { padded, loopEnd } = seamlessCopy(buffer);
          source = ctx.createBufferSource();
          source.buffer = padded; source.loop = true; source.loopStart = 0; source.loopEnd = loopEnd;
          source.connect(gain);
          source.start(0);
        }
        const now = ctx.currentTime;
        gain.gain.cancelScheduledValues(now);
        gain.gain.setValueAtTime(gain.gain.value, now);
        // First time: a slow swell over about five seconds. After a mute: back in about a second and a half.
        gain.gain.setTargetAtTime(VOLUME, now, firstTime ? 1.7 : 0.45);
      } else {
        try { await el.play(); } catch (e) { on = false; ui(); return; }
        rampElement(VOLUME, firstTime ? 5 : 1.4);
      }
    }
    function stop() {
      on = false; ui();
      if (mode === 'buffer' && ctx) {
        const now = ctx.currentTime;
        gain.gain.cancelScheduledValues(now);
        gain.gain.setValueAtTime(gain.gain.value, now);
        gain.gain.setTargetAtTime(0, now, 0.25); // a smooth fade, not a cut
        clearTimeout(suspendTimer);
        suspendTimer = setTimeout(() => { if (!on && ctx) ctx.suspend(); }, 1600);
      } else if (mode === 'element') {
        rampElement(0, 0.9);
      }
    }
    btn.addEventListener('click', () => {
      if (on) { stop(); wanted = false; store.set('stezy-sound', 'off'); }
      else { play(!started); started = true; wanted = true; store.set('stezy-sound', 'on'); }
    });
    // Browsers only allow sound after a click, tap or key press, so the loop starts on the first one
    const first = e => {
      if (e.target && e.target.closest && e.target.closest('#sound')) return;
      ['pointerdown', 'keydown', 'touchend'].forEach(ev => removeEventListener(ev, first, true));
      if (wanted && !started) { started = true; play(true); }
    };
    ['pointerdown', 'keydown', 'touchend'].forEach(ev => addEventListener(ev, first, true));
    // Fade out while the browser tab is hidden, and back in when it returns
    document.addEventListener('visibilitychange', () => {
      if (!started) return;
      if (document.hidden) { if (on) { stop(); resumeOnShow = true; } }
      else if (resumeOnShow) { resumeOnShow = false; play(false); }
    });
    function showHint() {
      if (started || !wanted) return;
      hintEl.classList.add('show');
      clearTimeout(hintTimer);
      hintTimer = setTimeout(hideHint, 7000);
    }
    function hideHint() { hintEl.classList.remove('show'); }
    ui();
    return { showHint };
  })();

  // Start each GPU effect the first time its scene comes near. Without WebGPU, the CSS look stays.
  var fxLive = {};
  function refreshLiquid() {
    if (!fxLive) return;
    ['intro', 'outro'].forEach(k => { if (fxLive[k]) { try { fxLive[k].update('liquid', liquidProps()); } catch (e) {} } });
  }
  if (!reduce && 'gpu' in navigator) {
    let lib = null, gpu = null;
    const load = async () => {
      if (!lib) {
        lib = await import('https://cdn.jsdelivr.net/npm/shaders@4.0.3/dist/js/bundle.js');
        try { gpu = await lib.createSharedDevice(); } catch (e) { gpu = null; }
      }
      return lib;
    };
    const fxObserver = new IntersectionObserver(entries => {
      entries.forEach(async en => {
        if (!en.isIntersecting) return;
        fxObserver.unobserve(en.target);
        const key = en.target.dataset.scene;
        const canvas = en.target.querySelector('.fx');
        const cfg = FX[key];
        try {
          const { createShader } = await load();
          fxLive[key] = await createShader(canvas, { components: cfg.components || cfg.make() }, {
            disableTelemetry: true,
            ...(gpu ? { gpu } : {}),
            onReady: () => canvas.classList.add('on'),
            onError: reason => { console.warn('Effect unavailable:', reason); canvas.classList.remove('on'); }
          });
        } catch (e) { console.warn('Effect could not start:', e); }
      });
    }, { rootMargin: '100% 0px' });
    scenes.forEach(s => { if (s.querySelector('.fx')) fxObserver.observe(s); });
  }

  function placeAnchors() {
    field.setAnchors({
      intro: document.getElementById('s-intro').offsetTop,
      outro: document.getElementById('s-outro').offsetTop
    });
  }
  placeAnchors();
  let anchorTimer;
  addEventListener('resize', () => { clearTimeout(anchorTimer); anchorTimer = setTimeout(placeAnchors, 200); });

  // Start on the tab the link asks for (a tab name or a project's tab), otherwise Games
  const startHash = location.hash.slice(1);
  const startProject = projects.find(x => x.slug === startHash);
  applyTab(TAB_LABEL[startHash] ? startHash : startProject ? startProject.cat : 'games');
  requestAnimationFrame(moveIndicator);
  if (document.fonts) document.fonts.ready.then(moveIndicator);
  rail.querySelector('[data-go="intro"]').setAttribute('aria-current', 'true');
  setTimeout(() => root.classList.add('loaded'), 300);
  scenes.forEach(s => io.observe(s));

  // ---------- Particle writer: type in the outro, share a link that opens with your word ----------
  const NOT_ALLOWED = /[^a-z0-9ąčęėįšųūž !?.,'&+\-#@:]/gi;
  const cleanWord = t => (t || '').replace(NOT_ALLOWED, '').replace(/\s+/g, ' ').trim().slice(0, 14).toUpperCase();
  const writer = document.getElementById('writer');
  const writerInput = document.getElementById('writer-input');
  const writerShare = document.getElementById('writer-share');
  let writeTimer;
  writerInput.addEventListener('input', () => {
    const v = writerInput.value.replace(NOT_ALLOWED, '');
    if (v !== writerInput.value) writerInput.value = v;
    const word = cleanWord(v);
    writerShare.disabled = !word;
    clearTimeout(writeTimer);
    writeTimer = setTimeout(() => field.setWord(word || 'STEZY', 'outro', 3), 160);
  });
  writer.addEventListener('submit', e => {
    e.preventDefault();
    const word = cleanWord(writerInput.value);
    if (!word) return;
    const link = 'https://stezy.lt/?w=' + encodeURIComponent(word).replace(/%20/g, '+');
    if (navigator.share && matchMedia('(pointer: coarse)').matches) navigator.share({ title: 'STEZY', url: link }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => toast('Link copied. Whoever opens it sees your word.'), () => toast(link));
    else toast(link);
  });
  // Someone sent a link with a word: the intro writes it instead of STEZY
  const sharedWord = cleanWord(new URLSearchParams(location.search).get('w'));
  if (sharedWord) {
    introWord = sharedWord;
    field.setWord(sharedWord);
    tagText.innerHTML = 'Someone wrote this for you. <strong>Write your own at the end.</strong>';
  }

  // ---------- Entrance intro (skipped by any scroll, click or key, and by deep links) ----------
  const playIntro = root.classList.contains('intro-play') && !location.hash;
  if (playIntro) {
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    if (scroller) { scroller.top(); scroller.pause(); } else scrollTo(0, 0);
    field.playIntro();
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      field.skipIntro();
      root.classList.remove('intro-play');
      if (scroller) scroller.resume();
      setTimeout(music.showHint, 900);
      ['wheel', 'pointerdown', 'keydown', 'touchstart'].forEach(ev => removeEventListener(ev, finish));
    };
    ['wheel', 'pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, finish, { passive: true }));
    setTimeout(finish, 1900);
  } else {
    root.classList.remove('intro-play');
    setTimeout(music.showHint, 1500);
  }
  route(true);
})();
</script>
</body>
